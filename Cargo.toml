[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
# Dependencies shared across multiple crates
anyhow = "1.0.89"
env_logger = "0.11.5"
log = "0.4.22"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
thiserror = "2.0.3"

# Internal crates
supa-mdx-lint = { path = "crates/supa-mdx-lint" }
supa_mdx_macros = { path = "crates/supa-mdx-macros" }
